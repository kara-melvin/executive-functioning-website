# Netlify configuration for Borrow My Executive Functioning.
# The site is plain HTML with no build step; everything under site/ is published as-is.

[build]
  publish = "site"

# Sensible security headers for a static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Serverless functions. netlify/functions/submission-created.js runs after every
# form submission and adds newsletter signups to MailerLite (see site/README.md).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
